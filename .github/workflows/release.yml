name: Release

on:
  push:
    branches: [ main ]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - flake.nix
      - package.nix
      - static.nix
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and publish even if the release already exists"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - name: Read version from Cargo.toml
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1 \
            && [ "${{ inputs.force }}" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static binary
        id: build
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v | .assets = {}' version.json > version.json.tmp
          mv version.json.tmp version.json

          out="$(nix build --no-link --print-out-paths '.#static^out')"
          install -m755 "$out/bin/discord" discord-linux-x86_64
          bin_sha="$(nix hash file --type sha256 --sri discord-linux-x86_64)"

          jq --arg s "$bin_sha" '.assets["x86_64-linux"] = $s' version.json > version.json.tmp
          mv version.json.tmp version.json
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish release asset
        if: steps.build.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "discord-cli ${VERSION}" \
              --notes "Static discord-cli ${VERSION}."
          fi
          gh release upload "v${VERSION}" discord-linux-x86_64 --clobber

      - name: Commit version metadata
        if: steps.build.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "release: discord-cli ${{ steps.version.outputs.version }}" || true
          git push

      - name: Tag release
        if: steps.build.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -f "v${VERSION}"
          git tag -f latest
          git push -f origin "v${VERSION}" latest

      - name: Verify the published flake fetches its asset
        if: steps.build.outputs.publish == 'true'
        run: nix build --no-link '.#default'
