[package]
name = "discord-cli"
version = "0.1.0"
edition = "2021"
description = "Discord REST CLI (user token injected by the nono proxy)"
license = "MIT"

[[bin]]
name = "discord"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls-native-roots",
] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
